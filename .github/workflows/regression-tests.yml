name: 🔒 Tests de Non-Régression EduTeQC

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: 🔧 Tests Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: eduteqc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: 📦 Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: 🗄️ Setup test database
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/eduteqc_test
      run: |
        cd backend
        npx prisma generate
        npx prisma db push

    - name: 🧪 Run backend tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/eduteqc_test
        NODE_ENV: test
      run: |
        cd backend
        npm run test:regression

    - name: 📊 Upload backend coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./backend/coverage/lcov.info
        flags: backend

  frontend-tests:
    name: 📱 Tests Frontend
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json

    - name: 📦 Install mobile dependencies
      run: |
        cd mobile
        npm ci --legacy-peer-deps

    - name: 🧪 Run mobile tests
      run: |
        cd mobile
        npm run test:regression

    - name: 📊 Upload mobile coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./mobile/coverage/lcov.info
        flags: frontend

  e2e-tests:
    name: 🔄 Tests End-to-End
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: eduteqc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: |
        cd backend
        npm ci
        cd ../
        npm install axios

    - name: 🗄️ Setup database and start server
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/eduteqc_test
        PORT: 3000
      run: |
        cd backend
        npx prisma generate
        npx prisma db push
        npx prisma db seed
        npm start &
        sleep 10  # Wait for server to start

    - name: 🧪 Run E2E tests
      env:
        API_BASE_URL: http://localhost:3000/api
      run: |
        node tests/e2e-tests.js

  performance-tests:
    name: ⚡ Tests de Performance
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: |
        npm install axios
        npm install -g autocannon

    - name: ⚡ Run performance tests
      run: |
        echo "🚀 Démarrage des tests de performance..."
        # Ici, on peut ajouter des tests de charge avec autocannon
        # autocannon -c 10 -d 30 http://localhost:3000/api/courses

  security-tests:
    name: 🔒 Tests de Sécurité
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔍 Run security audit
      run: |
        cd backend
        npm audit --audit-level high
        cd ../mobile
        npm audit --audit-level high --legacy-peer-deps

    - name: 🛡️ Check for vulnerabilities
      run: |
        cd backend
        npx audit-ci --high
        cd ../mobile
        npx audit-ci --high

  build-validation:
    name: 🏗️ Validation des Builds
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🏗️ Test backend build
      run: |
        cd backend
        npm ci
        npm run build

    - name: 📱 Test mobile build (expo)
      run: |
        cd mobile
        npm ci --legacy-peer-deps
        npx expo export --platform web

  notification:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, build-validation]
    if: always()

    steps:
    - name: 📢 Send notification
      if: failure()
      run: |
        echo "🚨 ALERTE: Des tests de non-régression ont échoué !"
        echo "Vérifiez les logs pour plus de détails."
        
    - name: ✅ Success notification
      if: success()
      run: |
        echo "🎉 Tous les tests de non-régression ont réussi !"
        echo "Le code est prêt pour la production."